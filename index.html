<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sonic Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1628;
    color: white;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #ui {
    width: 100%;
    max-width: 800px;
    padding: 12px;
    text-align: center;
  }
  h1 {
    color: #00ccff;
    margin: 8px 0 12px;
    font-size: 28px;
    text-shadow: 0 0 12px #00aaff;
  }
  canvas {
    background: linear-gradient(#87CEEB 0%, #4a90d9 70%, #228B22 70%);
    border: 3px solid #00aaff;
    border-radius: 10px;
    max-width: 100%;
    display: block;
    margin: 0 auto;
  }
  .btn {
    background: #00aa44;
    color: white;
    border: none;
    padding: 12px 22px;
    font-size: 17px;
    border-radius: 8px;
    cursor: pointer;
    margin: 6px;
    font-weight: bold;
  }
  .btn:active { transform: scale(0.96); }
  .char-btn {
    background: #0088cc;
    width: 85px;
    height: 85px;
    font-size: 38px;
    margin: 8px;
    border-radius: 12px;
  }
  .char-btn.selected {
    outline: 4px solid #ffdd00;
    box-shadow: 0 0 15px #ffdd00;
  }
  #scoreBoard, #highScore {
    font-size: 20px;
    margin: 4px 0;
  }
  #leaderboard {
    background: #1e2a3a;
    padding: 14px;
    border-radius: 10px;
    margin-top: 16px;
    max-width: 380px;
    text-align: left;
    font-size: 14px;
    line-height: 1.5;
    margin-left: auto;
    margin-right: auto;
  }
  #nameInput {
    padding: 9px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    width: 180px;
    margin: 10px 0;
  }
  .hidden { display: none !important; }
  .info {
    font-size: 13px;
    color: #aaccff;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>🦔 Sonic Runner</h1>

  <!-- Character Select Screen -->
  <div id="charSelect">
    <p style="margin-bottom:10px;">Choose your character</p>
    <button class="btn char-btn" data-char="sonic">🦔</button>
    <button class="btn char-btn" data-char="tails">🦊</button>
    <button class="btn char-btn" data-char="knuckles">🥊</button>
    <br>
    <button class="btn" id="startBtn">Start Run!</button>
    <p class="info">Sonic = faster &nbsp;|&nbsp; Tails = higher jump &nbsp;|&nbsp; Knuckles = balanced</p>
  </div>

  <!-- In-Game UI -->
  <div id="gameUI" class="hidden">
    <div id="scoreBoard">Rings: 0</div>
    <div id="highScore">Best: 0</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <p class="info">Tap screen / Space / ↑ to Jump</p>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOver" class="hidden">
    <h2 style="color:#ff5555; margin:10px 0;">Game Over!</h2>
    <p>You collected <span id="finalScore">0</span> Rings</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="12">
    <br>
    <button class="btn" id="saveScoreBtn">Save Score</button>
    <button class="btn" id="restartBtn">Play Again</button>
  </div>

  <!-- Local Leaderboard -->
  <div id="leaderboard">
    <strong>🏆 Local Leaderboard (this device)</strong>
    <div id="lbList" style="margin-top:8px;">No scores yet</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Character stats
const characters = {
  sonic:    { emoji: '🦔', jumpPower: -14.5, speedMult: 1.18 },
  tails:    { emoji: '🦊', jumpPower: -16.5, speedMult: 1.00 },
  knuckles: { emoji: '🥊', jumpPower: -13.8, speedMult: 1.08 }
};

let selectedChar = 'sonic';
let player, rings, obstacles, score, gameSpeed, gameRunning, frame;
let highScore = parseInt(localStorage.getItem('sonicRunnerBest') || '0');
let scores = JSON.parse(localStorage.getItem('sonicRunnerScores') || '[]');

// DOM
const charSelect = document.getElementById('charSelect');
const gameUI = document.getElementById('gameUI');
const gameOverScreen = document.getElementById('gameOver');
const scoreBoard = document.getElementById('scoreBoard');
const highScoreEl = document.getElementById('highScore');
const finalScoreEl = document.getElementById('finalScore');
const lbList = document.getElementById('lbList');

// Character buttons
document.querySelectorAll('.char-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedChar = btn.dataset.char;
  });
});
document.querySelector('[data-char="sonic"]').classList.add('selected');

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', () => {
  gameOverScreen.classList.add('hidden');
  charSelect.classList.remove('hidden');
});
document.getElementById('saveScoreBtn').addEventListener('click', saveScore);

// Controls
window.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'ArrowUp') && gameRunning) {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameRunning) jump();
});
canvas.addEventListener('mousedown', () => {
  if (gameRunning) jump();
});

function startGame() {
  charSelect.classList.add('hidden');
  gameUI.classList.remove('hidden');
  gameOverScreen.classList.add('hidden');

  const c = characters[selectedChar];
  player = {
    x: 90,
    y: 300,
    width: 42,
    height: 50,
    velY: 0,
    grounded: true,
    emoji: c.emoji,
    jumpPower: c.jumpPower,
    speedMult: c.speedMult
  };

  rings = [];
  obstacles = [];
  score = 0;
  gameSpeed = 5.2 * player.speedMult;
  frame = 0;
  gameRunning = true;

  scoreBoard.textContent = 'Rings: 0';
  highScoreEl.textContent = 'Best: ' + highScore;
  updateLeaderboardDisplay();
  requestAnimationFrame(loop);
}

function jump() {
  if (player.grounded) {
    player.velY = player.jumpPower;
    player.grounded = false;
  }
}

function loop() {
  if (!gameRunning) return;
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}

function update() {
  // Gravity & ground
  player.velY += 0.72;
  player.y += player.velY;
  if (player.y >= 300) {
    player.y = 300;
    player.velY = 0;
    player.grounded = true;
  }

  // Spawn rings
  if (frame % 55 === 0) {
    rings.push({
      x: canvas.width + 30,
      y: 160 + Math.random() * 120,
      size: 24
    });
  }

  // Spawn Eggman obstacles
  if (frame % 85 === 0) {
    obstacles.push({
      x: canvas.width + 40,
      y: 305,
      width: 48,
      height: 55,
      emoji: '🤖'
    });
  }

  // Move world
  gameSpeed += 0.0035;
  rings.forEach(r => r.x -= gameSpeed);
  obstacles.forEach(o => o.x -= gameSpeed);

  // Collect rings
  rings = rings.filter(r => {
    const dx = r.x - (player.x + 20);
    const dy = r.y - (player.y + 25);
    if (Math.abs(dx) < 38 && Math.abs(dy) < 42) {
      score += 10;
      scoreBoard.textContent = 'Rings: ' + score;
      return false;
    }
    return r.x > -40;
  });

  // Collision with Eggman
  for (let o of obstacles) {
    if (o.x < player.x + 38 &&
        o.x + o.width > player.x + 5 &&
        o.y < player.y + 48 &&
        o.y + o.height > player.y + 5) {
      endGame();
      return;
    }
  }

  obstacles = obstacles.filter(o => o.x > -70);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ground line
  ctx.fillStyle = '#1a6b1a';
  ctx.fillRect(0, 350, canvas.width, 50);

  // Player
  ctx.font = '44px Arial';
  ctx.fillText(player.emoji, player.x, player.y + 42);

  // Rings
  ctx.font = '28px Arial';
  rings.forEach(r => ctx.fillText('💍', r.x, r.y));

  // Eggman
  ctx.font = '42px Arial';
  obstacles.forEach(o => ctx.fillText(o.emoji, o.x, o.y + 5));
}

function endGame() {
  gameRunning = false;
  finalScoreEl.textContent = score;

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('sonicRunnerBest', highScore);
  }

  gameUI.classList.add('hidden');
  gameOverScreen.classList.remove('hidden');
}

function saveScore() {
  const name = (document.getElementById('nameInput').value.trim() || 'Anonymous').substring(0, 12);
  scores.push({
    name: name,
    score: score,
    char: selectedChar,
    date: new Date().toLocaleDateString()
  });
  scores.sort((a, b) => b.score - a.score);
  scores = scores.slice(0, 10); // keep top 10
  localStorage.setItem('sonicRunnerScores', JSON.stringify(scores));
  updateLeaderboardDisplay();
  document.getElementById('nameInput').value = '';
  alert('Score saved on this device!');
}

function updateLeaderboardDisplay() {
  if (scores.length === 0) {
    lbList.innerHTML = 'No scores yet – be the first!';
    return;
  }
  lbList.innerHTML = scores.map((s, i) => 
    `${i + 1}. <b>${s.name}</b> — ${s.score} Rings <span style="opacity:0.7">(${s.char})</span>`
  ).join('<br>');
}

// Init
updateLeaderboardDisplay();
highScoreEl.textContent = 'Best: ' + highScore;
</script>
</body>
</html>
