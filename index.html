<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SonicSlots</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050d1a;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px 12px;
  }
  #game {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(180deg, #0b1c33 0%, #071525 100%);
    border-radius: 24px;
    border: 2px solid #00b4ff;
    box-shadow: 0 0 40px rgba(0,180,255,0.25);
    padding: 20px 16px 28px;
    position: relative;
  }

  /* Title */
  .title {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(90deg, #00e5ff, #4fc3f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0,229,255,0.5);
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  /* Balance bar */
  .balance-bar {
    display: flex;
    justify-content: space-between;
    background: rgba(0,0,0,0.45);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 16px;
    border: 1px solid #1a3a5c;
  }
  .bal-item { text-align: center; }
  .bal-label { font-size: 11px; color: #8ab4d9; letter-spacing: 1px; }
  .bal-value { font-size: 22px; font-weight: 700; color: #ffd700; }

  #message {
    text-align: center;
    min-height: 24px;
    font-size: 15px;
    color: #ffdd55;
    margin-bottom: 14px;
    font-weight: 600;
  }

  /* Reels */
  .reels-box {
    background: #040c18;
    border-radius: 18px;
    padding: 14px 10px;
    border: 2px solid #1e4a7a;
    margin-bottom: 16px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
  }
  .reels-row {
    display: flex;
    gap: 8px;
  }
  .reel {
    flex: 1;
    height: 110px;
    background: linear-gradient(180deg, #0a1a30, #061018);
    border-radius: 12px;
    border: 2px solid #2a5a8a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .symbol {
    font-size: 48px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.7));
  }

  /* Hold / Nudge */
  .btn-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .btn-row button {
    flex: 1;
    padding: 10px 0;
    font-size: 12px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: #1a3a5c;
    color: #b0d4f1;
    cursor: pointer;
  }
  .btn-row button.held {
    background: #e53935;
    color: white;
    box-shadow: 0 0 12px rgba(229,57,53,0.6);
  }
  .btn-row button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Big round SPIN button */
  .spin-wrap {
    display: flex;
    justify-content: center;
    margin: 18px 0 12px;
  }
  #spinBtn {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 35%, #69f0ae, #00c853 60%, #009624);
    color: white;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 0 6px rgba(0,200,83,0.25),
                0 8px 25px rgba(0,200,83,0.45),
                inset 0 -6px 12px rgba(0,0,0,0.25);
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }
  #spinBtn:active {
    transform: scale(0.95);
  }

  /* Bet controls */
  .bet-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 6px;
  }
  .bet-row button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #1a3a5c;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
  }
  #betDisplay {
    font-size: 18px;
    font-weight: 700;
    color: #ffdd55;
    min-width: 90px;
    text-align: center;
  }

  .paytable {
    margin-top: 18px;
    background: rgba(0,0,0,0.35);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 11px;
    color: #9ec5e8;
    line-height: 1.5;
  }
  .paytable strong { color: #00e5ff; }
</style>
</head>
<body>
<div id="game">
  <div class="title">SonicSlots</div>

  <div class="balance-bar">
    <div class="bal-item">
      <div class="bal-label">RINGS</div>
      <div class="bal-value" id="credits">1000</div>
    </div>
    <div class="bal-item">
      <div class="bal-label">WIN</div>
      <div class="bal-value" id="winAmount">0</div>
    </div>
  </div>

  <div id="message">Hold is random • Nudge every spin</div>

  <div class="reels-box" id="reelsBox">
    <div class="reels-row">
      <div class="reel"><div class="symbol" id="r0">💍</div></div>
      <div class="reel"><div class="symbol" id="r1">💍</div></div>
      <div class="reel"><div class="symbol" id="r2">💍</div></div>
      <div class="reel"><div class="symbol" id="r3">💍</div></div>
      <div class="reel"><div class="symbol" id="r4">💍</div></div>
    </div>
  </div>

  <div class="btn-row">
    <button id="h0" disabled>HOLD</button>
    <button id="h1" disabled>HOLD</button>
    <button id="h2" disabled>HOLD</button>
    <button id="h3" disabled>HOLD</button>
    <button id="h4" disabled>HOLD</button>
  </div>
  <div class="btn-row">
    <button id="n0">NUDGE</button>
    <button id="n1">NUDGE</button>
    <button id="n2">NUDGE</button>
    <button id="n3">NUDGE</button>
    <button id="n4">NUDGE</button>
  </div>

  <div class="spin-wrap">
    <button id="spinBtn">SPIN</button>
  </div>

  <div class="bet-row">
    <button id="betMinus">−</button>
    <div id="betDisplay">Bet: 10</div>
    <button id="betPlus">+</button>
  </div>

  <div class="paytable">
    <strong>Paytable</strong><br>
    🦔 Sonic = 500 &nbsp;|&nbsp; 💎 Emerald = 300<br>
    🦊 Tails / 🥊 Knuckles / 🌸 Amy = 150<br>
    💍 Ring = 80 &nbsp;|&nbsp; 🌭 Chili Dog = 40<br>
    🤖 Eggman penalties: 1=−20  2=−40  3=−60  4=−80  5=−500<br>
    <strong>⭐ on middle reel = BONUS</strong> (5 Free Spins ×2)
  </div>
</div>

<script>
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

const symbols = ['🦔','🦊','🥊','🌸','💍','💎','🤖','🌭','⭐'];
const values = {
  '🦔': 500, '💎': 300, '🦊': 150, '🥊': 150,
  '🌸': 150, '💍': 80, '🌭': 40, '🤖': 0, '⭐': 0
};
const eggmanPenalty = {1:20, 2:40, 3:60, 4:80, 5:500};

let reels = [4,4,4,4,4];
let held = [false,false,false,false,false];
let holdAvailable = false;
let nudgesLeft = 1;
let credits = 1000;
let bet = 10;
let isSpinning = false;
let inBonus = false;
let freeSpinsLeft = 0;
let bonusMultiplier = 1;

const reelEls = [0,1,2,3,4].map(i => document.getElementById('r'+i));
const holdBtns = [0,1,2,3,4].map(i => document.getElementById('h'+i));
const nudgeBtns = [0,1,2,3,4].map(i => document.getElementById('n'+i));
const creditsEl = document.getElementById('credits');
const winEl = document.getElementById('winAmount');
const msgEl = document.getElementById('message');
const betEl = document.getElementById('betDisplay');
const spinBtn = document.getElementById('spinBtn');
const reelsBox = document.getElementById('reelsBox');

function haptic(type = 'medium') {
  try {
    if (window.Telegram?.WebApp?.HapticFeedback) {
      if (type === 'success') Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      else if (type === 'error') Telegram.WebApp.HapticFeedback.notificationOccurred('error');
      else Telegram.WebApp.HapticFeedback.impactOccurred(type);
    }
  } catch(e){}
}

holdBtns.forEach((btn, i) => {
  btn.addEventListener('click', () => {
    if (!holdAvailable || isSpinning || inBonus) return;
    held[i] = !held[i];
    btn.classList.toggle('held', held[i]);
    btn.textContent = held[i] ? 'HELD' : 'HOLD';
    haptic('light');
  });
});

nudgeBtns.forEach((btn, i) => {
  btn.addEventListener('click', () => {
    if (nudgesLeft <= 0 || isSpinning) return;
    reels[i] = (reels[i] + 1) % symbols.length;
    reelEls[i].textContent = symbols[reels[i]];
    nudgesLeft--;
    updateNudgeState();
    haptic('light');
    msgEl.textContent = nudgesLeft > 0 ? `Nudge left: ${nudgesLeft}` : 'Checking...';
    if (nudgesLeft === 0) checkWin();
  });
});

document.getElementById('betMinus').onclick = () => {
  if (bet > 5 && !inBonus) { bet -= 5; updateBet(); haptic('light'); }
};
document.getElementById('betPlus').onclick = () => {
  if (bet < 50 && !inBonus) { bet += 5; updateBet(); haptic('light'); }
};
function updateBet() { betEl.textContent = 'Bet: ' + bet; }

spinBtn.addEventListener('click', () => {
  haptic('medium');
  spin();
});

function spin() {
  if (isSpinning) return;

  if (!inBonus) {
    if (credits < bet) {
      msgEl.textContent = 'Not enough Rings!';
      haptic('error');
      return;
    }
    credits -= bet;
    creditsEl.textContent = credits;
  }

  winEl.textContent = '0';
  isSpinning = true;
  msgEl.textContent = inBonus ? `FREE SPIN ${6-freeSpinsLeft}/5` : 'Spinning...';

  const spinInterval = setInterval(() => {
    reels.forEach((_, i) => {
      if (!held[i]) {
        const idx = Math.floor(Math.random() * symbols.length);
        reels[i] = idx;
        reelEls[i].textContent = symbols[idx];
      }
    });
  }, 70);

  setTimeout(() => {
    clearInterval(spinInterval);

    reels.forEach((_, i) => {
      if (!held[i]) {
        const idx = Math.floor(Math.random() * symbols.length);
        reels[i] = idx;
        reelEls[i].textContent = symbols[idx];
      }
    });

    isSpinning = false;
    held = [false,false,false,false,false];
    holdBtns.forEach(btn => {
      btn.classList.remove('held');
      btn.textContent = 'HOLD';
    });

    if (!inBonus && symbols[reels[2]] === '⭐') {
      startBonus();
      return;
    }

    nudgesLeft = inBonus ? 0 : 1;
    updateNudgeState();

    if (!inBonus) {
      checkWin();
      if (Math.random() < 0.30) {
        holdAvailable = true;
        updateHoldState();
        msgEl.textContent += ' | 🎯 HOLD available!';
      } else {
        holdAvailable = false;
        updateHoldState();
      }
    } else {
      checkWin();
      freeSpinsLeft--;
      if (freeSpinsLeft <= 0) endBonus();
      else setTimeout(spin, 1400);
    }
  }, 1400);
}

function startBonus() {
  inBonus = true;
  freeSpinsLeft = 5;
  bonusMultiplier = 2;
  holdAvailable = false;
  nudgesLeft = 0;
  updateHoldState();
  updateNudgeState();
  msgEl.textContent = '🌟 SPECIAL STAGE! 5 Free Spins ×2';
  haptic('success');
  setTimeout(spin, 1800);
}

function endBonus() {
  inBonus = false;
  bonusMultiplier = 1;
  msgEl.textContent = 'Bonus finished!';
}

function checkWin() {
  const counts = {};
  reels.forEach(i => {
    const s = symbols[i];
    counts[s] = (counts[s] || 0) + 1;
  });

  let win = 0;
  let messages = [];

  const eggCount = counts['🤖'] || 0;
  if (eggCount > 0) {
    let loss = eggmanPenalty[eggCount] || 0;
    loss = Math.min(loss, credits);
    credits -= loss;
    messages.push(`🤖 \( {eggCount} Eggman − \){loss}`);
  }

  for (const [sym, cnt] of Object.entries(counts)) {
    if (cnt >= 3 && sym !== '⭐' && sym !== '🤖') {
      const base = values[sym];
      const mult = (cnt === 5 ? 3 : cnt === 4 ? 2 : 1) * bonusMultiplier;
      win = Math.round(base * mult * (bet / 10));
      messages.push(`${cnt}× \( {sym} + \){win}` + (bonusMultiplier > 1 ? ' (×2)' : ''));
      break;
    }
  }

  if (win === 0 && Object.values(counts).some(c => c >= 2)) {
    win = Math.round(15 * bonusMultiplier * (bet / 10));
    messages.push(`Two matching +${win}`);
  }

  if (win > 0) {
    credits += win;
    winEl.textContent = win;
    haptic('success');
  }

  creditsEl.textContent = credits;
  msgEl.textContent = messages.length ? messages.join(' | ') : 'No win';
  updateNudgeState();
}

function updateHoldState() {
  holdBtns.forEach(btn => btn.disabled = !holdAvailable || isSpinning || inBonus);
}
function updateNudgeState() {
  nudgeBtns.forEach(btn => btn.disabled = nudgesLeft <= 0 || isSpinning || inBonus);
}

updateHoldState();
updateNudgeState();
updateBet();
</script>
</body>
</html>
