<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sonic Slot Machine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #001f3f, #003366);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.3);
            border: 2px solid #00f3ff;
            max-width: 340px;
            width: 90%;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0000;
        }

        #balance-container {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ffd700;
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #000;
            padding: 15px;
            border-radius: 12px;
            border: 4px solid #ffcc00;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255, 204, 0, 0.5);
        }

        .reel {
            width: 75px;
            height: 95px;
            background: #ffffff;
            color: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
        }

        #spin-btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 20px rgba(0, 243, 255, 0.5);
            transition: transform 0.1s ease, opacity 0.2s ease;
            text-transform: uppercase;
        }

        #spin-btn:active {
            transform: scale(0.95);
        }

        #spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            height: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">Sonic Ring Slot</div>
        <div id="balance-container">🟡 Rings: <span id="balance">100</span></div>
        
        <div class="slot-machine">
            <div class="reel" id="reel1">🪙</div>
            <div class="reel" id="reel2">👟</div>
            <div class="reel" id="reel3">💎</div>
        </div>

        <button id="spin-btn" onclick="spinSlots()">SPIN (Cost: 10 Rings)</button>
        <div id="message"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 100;
        const costPerSpin = 10;
        const symbols = ['🪙', '👟', '💎', '🔵', '🍳', '⭐'];
        let isSpinning = false;

        function updateUI() {
            document.getElementById('balance').innerText = balance;
        }

        function spinSlots() {
            if (isSpinning) return;
            
            if (balance < costPerSpin) {
                document.getElementById('message').innerText = "Out of Rings! Game Over!";
                document.getElementById('message').style.color = "#ff4d4d";
                return;
            }

            balance -= costPerSpin;
            updateUI();
            isSpinning = true;
            
            let spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            document.getElementById('message').innerText = "Rolling fast...";
            document.getElementById('message').style.color = "#ffffff";

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            let reel1 = document.getElementById('reel1');
            let reel2 = document.getElementById('reel2');
            let reel3 = document.getElementById('reel3');

            let spinDuration = 1500;
            let shuffleInterval = setInterval(() => {
                reel1.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                reel2.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                reel3.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            }, 80);

            setTimeout(() => {
                clearInterval(shuffleInterval);

                let final1 = symbols[Math.floor(Math.random() * symbols.length)];
                let final2 = symbols[Math.floor(Math.random() * symbols.length)];
                let final3 = symbols[Math.floor(Math.random() * symbols.length)];

                reel1.innerText = final1;
                reel2.innerText = final2;
                reel3.innerText = final3;

                checkWin(final1, final2, final3);

                isSpinning = false;
                spinBtn.disabled = false;
            }, spinDuration);
        }

        function checkWin(s1, s2, s3) {
            let msg = document.getElementById('message');
            let winAmount = 0;

            if (s1 === s2 && s2 === s3) {
                if (s1 === '⭐') winAmount = 300; // Super Sonic Star Jackpot
                else if (s1 === '💎') winAmount = 200; // Chaos Emeralds
                else if (s1 === '🔵') winAmount = 150; // Sonic Head
                else winAmount = 75;

                msg.innerText = `⚡ JACKPOT! +${winAmount} Rings!`;
                msg.style.color = "#00ffcc";

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                winAmount = 15;
                msg.innerText = `✨ Ring Bonus! +${winAmount}`;
                msg.style.color = "#ffcc00";

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            } else {
                msg.innerText = "Lost your rings! Spin again!";
                msg.style.color = "#ff4d4d";
            }

            balance += winAmount;
            updateUI();
        }
    </script>
</body>
</html>
