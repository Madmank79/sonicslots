<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sonic Runner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #87CEEB; /* Sky blue */
        }
        #gameCanvas {
            display: block;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-family: Arial, sans-serif;
            color: white;
            text-shadow: 2px 2px black;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas"></canvas>

<script>
// --- Setup Canvas ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Resize canvas to window size
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Game Variables
let score = 0;
let frame = 0;
let gameSpeed = 5;
let isGameOver = false;

// Sonic Object (Simplified for example)
const sonic = {
    x: 50,
    y: canvas.height - 150, // Ground level
    width: 60,
    height: 60,
    velocityY: 0,
    gravity: 0.8,
    jumpForce: -15,
    isJumping: false
};

// Obstacle Array
let obstacles = [];

// --- Input Handling ---
window.addEventListener('mousedown', () => {
    if (isGameOver) {
        resetGame();
    } else if (!sonic.isJumping) {
        sonic.velocityY = sonic.jumpForce;
        sonic.isJumping = true;
    }
});

// --- Game Logic ---

function updateSonic() {
    // Apply gravity
    sonic.y += sonic.velocityY;
    sonic.velocityY += sonic.gravity;

    // Ground detection
    if (sonic.y > canvas.height - 150) {
        sonic.y = canvas.height - 150;
        sonic.velocityY = 0;
        sonic.isJumping = false;
    }
}

function handleObstacles() {
    // Spawn new obstacles
    if (frame % 100 === 0) {
        const size = 30; // spike size
        obstacles.push({
            x: canvas.width,
            y: canvas.height - 150 - size,
            width: size,
            height: size
        });
    }

    // Move and draw obstacles
    for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].x -= gameSpeed;

        // Draw simple red spike
        ctx.fillStyle = 'red';
        ctx.fillRect(obstacles[i].x, obstacles[i].y, obstacles[i].width, obstacles[i].height);

        // Collision Detection (AABB)
        if (
            sonic.x < obstacles[i].x + obstacles[i].width &&
            sonic.x + sonic.width > obstacles[i].x &&
            sonic.y < obstacles[i].y + obstacles[i].height &&
            sonic.y + sonic.height > obstacles[i].y
        ) {
            isGameOver = true;
        }

        // Remove off-screen obstacles
        if (obstacles[i].x + obstacles[i].width < 0) {
            obstacles.splice(i, 1);
            score++;
            document.getElementById('score').innerText = 'Score: ' + score;
        }
    }
}

function drawGround() {
    ctx.fillStyle = '#228B22'; // Forest Green
    ctx.fillRect(0, canvas.height - 150, canvas.width, 150);
}

// --- Main Game Loop ---
function animate() {
    if (isGameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = '50px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        ctx.font = '20px Arial';
        ctx.fillText('Tap to Restart', canvas.width/2, canvas.height/2 + 50);
        return; // Stop loop
    }

    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear screen

    drawGround();
    
    // Draw simple Blue Sonic box
    ctx.fillStyle = 'blue';
    ctx.fillRect(sonic.x, sonic.y, sonic.width, sonic.height);
    
    updateSonic();
    handleObstacles();
    
    frame++;
}

function resetGame() {
    isGameOver = false;
    score = 0;
    obstacles = [];
    frame = 0;
    document.getElementById('score').innerText = 'Score: ' + score;
    animate();
}

// Start the loop
animate();

// Handle Window Resize
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    sonic.y = canvas.height - 150;
});

</script>
</body>
</html>
