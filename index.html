<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Slots</title>
    <style>
        body {
            background: linear-gradient(135deg, #0a1628, #1a2a4a);
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        #game-container {
            max-width: 420px;
            margin: 0 auto;
            background: #1e2a3a;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            border: 3px solid #00aaff;
        }
        h1 {
            color: #00ccff;
            margin: 0 0 10px 0;
            font-size: 28px;
            text-shadow: 0 0 10px #00aaff;
        }
        #message {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffdd44;
            min-height: 24px;
            font-weight: bold;
        }
        .reels-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 52px;
            background: #0d1520;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 3px solid #334;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .reel {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            border-radius: 10px;
            border: 2px solid #445;
        }
        .control-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 11px 14px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.15s;
        }
        button:hover {
            filter: brightness(1.15);
        }
        button:active {
            transform: scale(0.96);
        }
        button.held {
            background-color: #ff3333 !important;
            box-shadow: 0 0 12px #ff4444;
        }
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        #spinBtn {
            background: linear-gradient(180deg, #00dd66, #00aa44);
            font-size: 20px;
            width: 100%;
            padding: 14px;
            margin: 10px 0 15px 0;
            border: 2px solid #00ff88;
        }
        #spinBtn:hover {
            background: linear-gradient(180deg, #22ff88, #00cc55);
        }
        .stats {
            font-size: 20px;
            font-weight: bold;
            color: #ffdd44;
        }
        .paytable {
            font-size: 12px;
            color: #aaccff;
            margin-top: 15px;
            line-height: 1.5;
            text-align: left;
            background: #152030;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🦔 Sonic Slots</h1>
    <div id="message">Gotta go fast! Hold & Nudge available every spin</div>
    
    <!-- Reels -->
    <div class="reels-row">
        <div class="reel" id="reel1">💍</div>
        <div class="reel" id="reel2">💍</div>
        <div class="reel" id="reel3">💍</div>
    </div>

    <!-- Hold Buttons -->
    <div class="control-row">
        <button id="hold1">Hold 1</button>
        <button id="hold2">Hold 2</button>
        <button id="hold3">Hold 3</button>
    </div>

    <!-- Nudge Buttons -->
    <div class="control-row">
        <button id="nudge1">Nudge 1</button>
        <button id="nudge2">Nudge 2</button>
        <button id="nudge3">Nudge 3</button>
    </div>

    <button id="spinBtn">Spin (10 Rings)</button>
    
    <div class="stats">Rings: <span id="credits">100</span></div>

    <div class="paytable">
        <strong>Paytable</strong><br>
        3× Sonic = 500 &nbsp;|&nbsp; 3× Chaos Emerald = 300<br>
        3× Tails / Knuckles / Amy = 150<br>
        3× Ring = 80 &nbsp;|&nbsp; 3× Chili Dog = 40<br>
        Any 2 matching = 20<br>
        3× Eggman = Lose 50 Rings ☠
    </div>
</div>

<script>
    // ===== SYMBOLS =====
    const symbols = [
        '🦔', // Sonic
        '🦊', // Tails
        '🥊', // Knuckles
        '🌸', // Amy
        '💍', // Ring
        '💎', // Chaos Emerald
        '🤖', // Eggman
        '🌭'  // Chili Dog
    ];

    const symbolValues = {
        '🦔': 500,   // Sonic
        '💎': 300,   // Chaos Emerald
        '🦊': 150,   // Tails
        '🥊': 150,   // Knuckles
        '🌸': 150,   // Amy
        '💍': 80,    // Ring
        '🌭': 40,    // Chili Dog
        '🤖': -50    // Eggman (lose)
    };

    // ===== STATE =====
    let reels = [4, 4, 4]; // start on Rings
    let held = [false, false, false];
    let nudgesRemaining = 1; // always available after every spin
    let credits = 100;
    let isSpinning = false;

    // ===== DOM =====
    const reelElements = [
        document.getElementById('reel1'),
        document.getElementById('reel2'),
        document.getElementById('reel3')
    ];
    const holdElements = [
        document.getElementById('hold1'),
        document.getElementById('hold2'),
        document.getElementById('hold3')
    ];
    const nudgeElements = [
        document.getElementById('nudge1'),
        document.getElementById('nudge2'),
        document.getElementById('nudge3')
    ];
    const creditDisplay = document.getElementById('credits');
    const messageDisplay = document.getElementById('message');
    const spinButton = document.getElementById('spinBtn');

    // ===== HOLD =====
    holdElements.forEach((btn, index) => {
        btn.addEventListener('click', () => {
            if (isSpinning) return;
            held[index] = !held[index];
            btn.classList.toggle('held', held[index]);
            btn.textContent = held[index] ? 'HELD' : `Hold ${index + 1}`;
        });
    });

    // ===== NUDGE =====
    nudgeElements.forEach((btn, index) => {
        btn.addEventListener('click', () => {
            if (isSpinning || nudgesRemaining <= 0) return;

            reels[index] = (reels[index] + 1) % symbols.length;
            reelElements[index].textContent = symbols[reels[index]];
            nudgesRemaining--;

            updateNudgeButtons();
            messageDisplay.textContent = nudgesRemaining > 0 
                ? `Nudge used! ${nudgesRemaining} left` 
                : 'Nudge used! Checking result...';

            if (nudgesRemaining === 0) {
                checkWin();
            }
        });
    });

    // ===== SPIN =====
    spinButton.addEventListener('click', spinReels);

    function spinReels() {
        if (isSpinning) return;
        if (credits < 10) {
            messageDisplay.textContent = "Not enough Rings!";
            return;
        }

        credits -= 10;
        creditDisplay.textContent = credits;
        isSpinning = true;
        messageDisplay.textContent = "Spinning... Gotta go fast!";
        
        // Reset holds visually after spin starts
        // (we keep the held state until the spin finishes)

        let spinInterval = setInterval(() => {
            reels.forEach((_, i) => {
                if (!held[i]) {
                    const randomIndex = Math.floor(Math.random() * symbols.length);
                    reels[i] = randomIndex;
                    reelElements[i].textContent = symbols[randomIndex];
                }
            });
        }, 80);

        setTimeout(() => {
            clearInterval(spinInterval);

            // Final positions
            reels.forEach((_, i) => {
                if (!held[i]) {
                    const randomIndex = Math.floor(Math.random() * symbols.length);
                    reels[i] = randomIndex;
                    reelElements[i].textContent = symbols[randomIndex];
                }
            });

            isSpinning = false;

            // Reset holds
            held = [false, false, false];
            holdElements.forEach((btn, i) => {
                btn.classList.remove('held');
                btn.textContent = `Hold ${i + 1}`;
            });

            // Always give 1 nudge after every spin
            nudgesRemaining = 1;
            updateNudgeButtons();
            messageDisplay.textContent = "1 Nudge available – use it or spin again!";
            
            // Auto-check if player doesn't want to nudge
            // (they can still click nudge, or just spin again)
        }, 1400);
    }

    function checkWin() {
        const s1 = symbols[reels[0]];
        const s2 = symbols[reels[1]];
        const s3 = symbols[reels[2]];

        // Three of a kind
        if (s1 === s2 && s2 === s3) {
            const value = symbolValues[s1];
            if (value < 0) {
                // Eggman
                const loss = Math.min(Math.abs(value), credits);
                credits -= loss;
                messageDisplay.textContent = `☠ Eggman! Lost ${loss} Rings!`;
            } else {
                credits += value;
                messageDisplay.textContent = `JACKPOT! 3× \( {s1} → + \){value} Rings!`;
            }
        }
        // Any two matching
        else if (s1 === s2 || s2 === s3 || s1 === s3) {
            credits += 20;
            messageDisplay.textContent = `Nice! Two matching → +20 Rings`;
        } else {
            messageDisplay.textContent = "No win – try again!";
        }

        creditDisplay.textContent = credits;
        nudgesRemaining = 0;
        updateNudgeButtons();
    }

    function updateNudgeButtons() {
        nudgeElements.forEach(btn => {
            btn.disabled = nudgesRemaining <= 0 || isSpinning;
        });
    }

    // Initial state
    updateNudgeButtons();
</script>

</body>
</html>
